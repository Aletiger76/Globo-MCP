# Virtual host Apache per Globo MCP - ambiente di sviluppo
# Montato nel container web come /etc/apache2/sites-available/000-default.conf

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/globo_error.log
    CustomLog ${APACHE_LOG_DIR}/globo_access.log combined
    LogLevel warn
</VirtualHost>
